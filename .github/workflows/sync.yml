name: Sync catalog from muse.ai

on:
  # schedule disabled (the daily 6:09 AM PT run is triggered externally via workflow_dispatch)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies (incl. headless Chromium)
        run: |
          pip install -r scripts/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Re-extract catalog and regenerate site
        run: python scripts/sync.py

      - name: Commit and push if changed
        run: |
          git add -A data.json dedupe_report.json assets/data.js assets/style.css original sources thumbs
          if git diff --cached --quiet; then
            echo "No changes in source; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync catalog from muse.ai ($(date -u +%Y-%m-%d))"
          git push
